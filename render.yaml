services:
  - type: web
    name: watch-app
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GIPHY_API_KEY
        sync: false
